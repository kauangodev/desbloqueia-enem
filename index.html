<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desbloqueia Enem</title>
    <meta name="description" content="Desbloqueia Enem — projeto em construção." />
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #f5f7ff; }
      main { width: min(680px, calc(100% - 40px)); padding: 48px 0; }
      .eyebrow { color: #8da2ff; letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; font-weight: 700; }
      h1 { margin: 16px 0; font-size: clamp(2.7rem, 10vw, 5.8rem); line-height: .95; letter-spacing: -.06em; }
      p { max-width: 520px; color: #b7c0d9; font-size: 1.1rem; line-height: 1.6; }
      .status { display: inline-flex; margin-top: 20px; padding: 10px 14px; border: 1px solid #2c3963; border-radius: 999px; color: #cbd5ff; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Projeto em construção</div>
      <h1>Desbloqueia Enem</h1>
      <p>Uma nova experiência para estudar com mais clareza, ritmo e confiança. Em breve, este espaço vai ganhar seus próximos recursos.</p>
      <div class="status">Primeira versão publicada</div>
    </main>
  </body>
</html>
